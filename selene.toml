std = "testkit"
exclude = ["deps/*", "packages/vendor/*", "**/Generated*.luau", "packages/kits/*/*/server/Net.luau", "packages/kits/*/*/client/Net.luau", "examples/modules/*/server/Net.luau", "examples/modules/*/client/Net.luau", "games/*/modules/*/server/Net.luau", "games/*/modules/*/client/Net.luau", "**/modules/*/server/Net.luau", "**/modules/*/client/Net.luau", ".cache/*", "**/*.d.luau", "examples/legacy/*"]

[rules]
