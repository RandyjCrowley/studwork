# Selene std for *.spec.luau globals injected by tools/lune/testkit/harness.luau
---
base: roblox
name: testkit
globals:
  describe:
    args:
      - type: string
      - type: function
  it:
    args:
      - type: string
      - type: function
  expect:
    args:
      - type: any
  beforeEach:
    args:
      - type: function
  afterEach:
    args:
      - type: function
  Stubs:
    struct: Stubs
structs:
  Stubs:
    "*":
      property: read-only
