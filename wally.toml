# ============================================================================================
# PUBLISH-ONLY MANIFEST. NOT PUBLISHED YET.
#
# NEVER run `wally install` in the repo root. macOS is case-insensitive: Wally would write its
# Packages/ folder into packages/ (the framework source). The development dependencies are
# installed from deps/wally.toml into deps/Packages and deps/ServerPackages by `tools/install`.
# Use tools/install. This file only describes what a future `wally publish` would ship.
#
# Keep [dependencies] / [server-dependencies] identical to deps/wally.toml (exact pins).
# ============================================================================================

[package]
name = "randyjcrowley/studwork"
version = "1.7.0"
description = "StudWork: an opinionated Roblox game framework (Luau, strict) with optional kit modules and a React UI kit"
license = "MIT"
authors = ["RandyjCrowley"]
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
homepage = "https://github.com/RandyjCrowley/studwork"
repository = "https://github.com/RandyjCrowley/studwork"
include = ["packages", "LICENSE", "README.md", "wally.toml"]

[dependencies]
Charm = "littensy/charm@=0.11.1"
CharmSync = "littensy/charm-sync@=0.4.1"
React = "jsdotlua/react@=17.2.1"
ReactRoblox = "jsdotlua/react-roblox@=17.2.1"
ReactCharm = "littensy/react-charm@=0.4.1"
Signal = "sleitnick/signal@=2.0.3"
Trove = "sleitnick/trove@=1.8.0"
Promise = "evaera/promise@=4.0.0"

[server-dependencies]
ProfileStore = "lm-loleris/profilestore@=1.0.3"
